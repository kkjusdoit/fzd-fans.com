<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>植物大战饭圈 · 樊振东的互联网档案馆</title>
<link rel="icon" type="image/png" href="/favicon.png" />
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; overflow: hidden;
    background: linear-gradient(180deg, #66bb6a 0%, #4a9d3f 45%, #2e7d32 100%);
    font-family: 'PingFang SC', 'Microsoft YaHei', 'Arial', sans-serif;
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
    width: 100vw; height: 100vh; height: 100dvh;
  }
  #wrap {
    position: relative; width: 100vw; height: 100vh; height: 100dvh;
    display: flex; justify-content: center; align-items: center; overflow: hidden;
  }
  #game { background: #5da13c; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.4); display: block; touch-action: none; }
  #back-btn {
    position: absolute; right: max(14px, env(safe-area-inset-right)); bottom: max(14px, env(safe-area-inset-bottom)); z-index: 50;
    background: linear-gradient(to bottom, #42a5f5, #1565c0); color: #fff; text-decoration: none;
    padding: 7px 15px; border-radius: 20px; font-size: 13px; font-weight: bold;
    box-shadow: 0 3px #0d3b66; border: none;
  }
  #back-btn:active { transform: translateY(3px); box-shadow: 0 0 #0d3b66; }
  #pause-btn {
    position: absolute; bottom: max(14px, env(safe-area-inset-bottom)); left: max(14px, env(safe-area-inset-left)); z-index: 50; display: none;
    background: linear-gradient(to bottom, #78909c, #455a64); color: #fff;
    padding: 7px 15px; border-radius: 20px; font-size: 13px; font-weight: bold;
    box-shadow: 0 3px #263238; border: none; cursor: pointer;
    touch-action: manipulation; font-family: inherit;
  }
  #pause-btn:active { transform: translateY(3px); box-shadow: 0 0 #263238; }
  /* Overlay panels (menu / dialog / mapselect / result) */
  .overlay {
    position: absolute; inset: 0; z-index: 40; display: none;
    flex-direction: column; justify-content: center; align-items: center;
    padding: 20px; text-align: center; color: #fff;
    background: rgba(15, 40, 12, .84); backdrop-filter: blur(4px);
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    touch-action: pan-y;
  }
  .overlay.show { display: flex; }
  .panel {
    max-width: 560px; width: 100%; background: rgba(27, 94, 32, .55);
    border: 1px solid rgba(255,255,255,.18); border-radius: 18px; padding: 26px 22px;
    box-shadow: 0 12px 40px rgba(0,0,0,.35);
  }
  .title { font-size: clamp(26px, 6vw, 44px); font-weight: 900; letter-spacing: 2px;
    background: linear-gradient(45deg, #ffd54f, #fff, #90caf9); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; margin: 0 0 6px; }
  .subtitle { color: #bbdefb; font-size: 15px; margin: 0 0 18px; letter-spacing: 1px; }
  .story { color: #e3f2fd; font-size: clamp(14px, 3.4vw, 17px); line-height: 1.9; margin: 10px 0 20px; text-align: left; }
  .story b { color: #ffd54f; }
  .btn {
    display: inline-block; cursor: pointer; border: none; margin: 6px;
    background: linear-gradient(45deg, #ffb300, #ffca28); color: #4e2f00;
    padding: 13px 34px; font-size: 18px; font-weight: 800; border-radius: 40px;
    box-shadow: 0 5px #b37400; transition: transform .1s;
    touch-action: manipulation;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px #b37400; }
  .btn.ghost { background: rgba(255,255,255,.14); color: #fff; box-shadow: 0 5px rgba(0,0,0,.25); }
  .levels { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; margin: 14px 0; }
  .lv-card {
    width: 150px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.2);
    border-radius: 14px; padding: 16px 12px; cursor: pointer; transition: transform .12s, background .2s;
    touch-action: manipulation; color: #fff; font-family: inherit; text-align: center;
  }
  .lv-card:active { transform: scale(.96); }
  .lv-card.locked { opacity: .45; filter: grayscale(.6); cursor: not-allowed; }
  .lv-card .lv-title { display: block; margin: 4px 0 6px; font-size: 17px; font-weight: bold; }
  .lv-card .lv-sub { display: block; font-size: 12px; color: #bbdefb; min-height: 32px; }
  .lv-card .stars { display: block; font-size: 16px; margin-top: 8px; color: #ffd54f; letter-spacing: 2px; }
  .unlock-tip { color: #a5d6a7; font-size: 14px; margin-top: 10px; }
  .rotate-hint {
    position: absolute; inset: 0; z-index: 60; display: none;
    flex-direction: column; justify-content: center; align-items: center; gap: 14px;
    background: rgba(6,28,58,.95); color: #fff; font-size: 18px; text-align: center; padding: 30px;
  }
  .rotate-hint .ico { font-size: 60px; animation: rot 2s ease-in-out infinite; }
  @keyframes rot { 0%,100% { transform: rotate(0); } 50% { transform: rotate(90deg); } }
  @media (max-aspect-ratio: 1/1) { .rotate-hint.on { display: flex; } }
  /* 矮视口(横屏手机):压缩排版,确保按钮首屏可见;仍保留滚动兜底。放在末尾以覆盖前面同名规则。
     阈值取 620:覆盖手机横屏地址栏收起前后(innerHeight 340~600)的所有状态,避免布局跳档"面板变大" */
  @media (max-height: 620px) {
    .overlay { justify-content: flex-start; padding: 8px; }
    .panel { padding: 10px 16px; }
    .title { font-size: clamp(18px, 5vh, 28px); letter-spacing: 1px; margin: 0 0 2px; }
    .subtitle { font-size: 12px; margin: 0 0 5px; }
    .story { font-size: clamp(11px, 2.5vh, 13px); line-height: 1.35; margin: 3px 0 7px; }
    .btn { padding: 7px 22px; font-size: 15px; margin: 3px; }
    .levels { gap: 8px; margin: 7px 0; }
    .lv-card { width: 118px; padding: 9px 8px; }
    .lv-card .lv-sub { min-height: 0; }
    .lv-card .lv-title { margin: 2px 0 3px; font-size: 15px; }
  }
</style>
</head>
<body>
<div id="wrap">
  <a id="back-btn" href="/games">← 返回</a>
  <button id="pause-btn">⏸ 暂停</button>
  <canvas id="game" width="960" height="600"></canvas>

  <!-- 主菜单 -->
  <div id="ov-menu" class="overlay">
    <div class="panel">
      <h1 class="title">植物大战饭圈</h1>
      <p class="subtitle">让 · 体育 · 回归 · 体育</p>
      <div class="story">
        在没有乒乓饭圈以前，人们输球就输了，不找理由。<br>
        直到有一天，草坪的另一端传来了熟悉的呻吟——<br>
        <b>饭圈，像僵尸一样涌来了。</b><br>
        甩锅僵尸、阴谋论僵尸、控评水军僵尸……<br>
        它们嘴里念着“健康完赛”“研究队友”“输送技术”。<br>
        种下植物，点击收集<b>金牌</b>——那都是超级金满贯的来时路。<br>
        金牌含金量越高，荣誉值越多：<b>奥运单打 +200</b>，团体 +60，巡回赛 +25。
      </div>
      <button class="btn" id="btn-start">进入战役</button>
    </div>
  </div>

  <!-- 选关 -->
  <div id="ov-map" class="overlay">
    <div class="panel">
      <h1 class="title" style="font-size:clamp(22px,5vw,34px)">选择关卡</h1>
      <div class="levels" id="level-list"></div>
      <button class="btn ghost" id="btn-map-back">返回菜单</button>
    </div>
  </div>

  <!-- 剧情 / 过场 -->
  <div id="ov-dialog" class="overlay">
    <div class="panel">
      <h1 class="title" id="dlg-title" style="font-size:clamp(22px,5vw,34px)"></h1>
      <div class="story" id="dlg-body"></div>
      <button class="btn" id="btn-dlg-next">开始防守</button>
    </div>
  </div>

  <!-- 结算 -->
  <div id="ov-result" class="overlay">
    <div class="panel">
      <h1 class="title" id="res-title"></h1>
      <div class="story" id="res-body" style="text-align:center"></div>
      <div id="res-stars" style="font-size:38px;color:#ffd54f;letter-spacing:6px;margin:6px 0 4px"></div>
      <div id="res-unlock" class="unlock-tip"></div>
      <div>
        <button class="btn" id="btn-res-next">继续</button>
        <button class="btn ghost" id="btn-res-retry">重玩本关</button>
      </div>
    </div>
  </div>

  <div class="rotate-hint on"><div class="ico">📱</div><div>游戏已暂停<br>请横屏握持手机继续防守</div></div>
</div>

<script>

(function () {

const ctx = CV.getContext('2d');
const W = 960, H = 600;

const BOARD_W = W - BOARD_X - 8;
const BOARD_H = H - BOARD_Y - 12;
const CELL_W = BOARD_W / COLS;
const CELL_H = BOARD_H / ROWS;
const HOME_X = BOARD_X;                     // 越过此线即被清台机拦截 / 失败

// ====================== 金牌池(肉鸽抽取) ======================
// 每一缕阳光都是一枚真实金牌:v = 荣誉值,w = 抽中概率权重(越大越常见)

const MEDAL_POOL = [

  { t:'2021 休斯敦世乒赛男单冠军', v:150, w:2 },
  { t:'2023 德班世乒赛男单冠军', v:150, w:2 },
  // ★★ 世界杯/大满贯单打(稀有)
  { t:'2016 男乒世界杯冠军', v:100, w:3 },
  { t:'2018 男乒世界杯冠军', v:100, w:3 },
  { t:'2019 男乒世界杯冠军', v:100, w:3 },

  { t:'2025-2026 德甲联赛男团冠军（萨尔布吕肯俱乐部）', v:35, w:10 },

  { t:'2018 中国公开赛男单冠军', v:25, w:14 },
  { t:'2017 澳大利亚公开赛冠军', v:25, w:14 },

];
const MEDAL_TOTAL_W = MEDAL_POOL.reduce((s, m) => s + m.w, 0);
function pickMedal() {
  let r = Math.random() * MEDAL_TOTAL_W;
  for (const m of MEDAL_POOL) { r -= m.w; if (r <= 0) return m; }
  return MEDAL_POOL[MEDAL_POOL.length - 1];
}

// ====================== 存档 ======================
const SAVE_KEY = 'fzd_td_progress';
function loadSave() {
  try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || {}; } catch (e) { return {}; }
}
function saveGame(s) { try { localStorage.setItem(SAVE_KEY, JSON.stringify(s)); } catch (e) {} }
let SAVE = loadSave();
SAVE.stars = SAVE.stars || {};        // { levelIndex: starCount }
SAVE.cleared = SAVE.cleared || [];    // [levelIndex...]

// ====================== 防御单位定义 ======================
// unlockLevel: 从第几关开始可用(0 表示一开始就有)
const DEFENDERS = {
  server:  { name:'乒乓球拍', emoji:'🏓', cost:100, hp:120, cd:0,   unlockLevel:0, kind:'shooter', interval:1.5, dmg:20, color:'#fffde7', desc:'球拍弹击，连发乒乓球' },
  cabinet: { name:'向日葵',   emoji:'🌻', cost:75,  hp:100, cd:0,   unlockLevel:0, kind:'producer', interval:12, color:'#ffb300', desc:'定时产出金牌（荣誉值）' },
  wall:    { name:'乒乓球桌', emoji:'', table:true, cost:50,  hp:420, cd:0,   unlockLevel:0, kind:'wall', color:'#1565c0', desc:'掀起球桌立成盾牌，扛住僵尸啃咬' },
  loop:    { name:'发球机器人', emoji:'🤖', cost:175, hp:120, cd:0,   unlockLevel:1, kind:'shooter', interval:1.5, dmg:20, pierce:true, color:'#b0bec5', desc:'重旋弧圈球，一发穿透整行' },
  referee: { name:'寒冰裁判', emoji:'❄️', cost:150, hp:120, cd:0,   unlockLevel:1, kind:'shooter', interval:1.8, dmg:10, slow:true, color:'#4fc3f7', desc:'冰冻乒乓球减速僵尸' },

const DEF_ORDER = ['server','cabinet','wall','loop','referee','smash'];

// COMMON_DEAD 为全体僵尸共享的通用池,与各自专属池合并抽取
const COMMON_DEAD = [
  '没有健康完赛……呜呜呜。',
  '我们被研究了…',
  '我们被针对了…',

  '菜就要多练',
  '你怎么知道我是超级金满贯？',
  '有什么事，跟我的超级全满贯说去吧',

  '有意见？跟巴黎的那块金牌反映',
  '不服？先拿个全满贯再说',
  '11:0，下一位',
  '小作文再长，也接不住这一板',
  '热搜能刷，比分刷不了',
  '键盘敲得响，球台上见真章',
  '这球叫暴冲，记进小作文里吧',
  '弧圈球，不接受反驳',

const ENEMIES = {
  follower:   { name:'跟风僵尸',   emoji:'🧟', acc:'',    hp:110,  speed:14, dmg:18, color:'#90a4ae',
                dead:['哦…原来输球就是输球啊','大家骂我才跟着骂的…','原来我根本没看过比赛','取关了取关了','跟错风了，撤！'] },

                dead:['体育…原来本该是这样的啊'] },

// ====================== 关卡数据 ======================
// wave: 每波 { at: 秒, spawns:[{type, row(可选,默认随机)}] }
function grp(type, n) { return Array.from({length:n}, () => ({type})); }
const LEVELS = [
  {
    name: '第一关 · 赛后评论区',
    dialogTitle: '赛后评论区',

// ====================== 游戏状态 ======================
let state = 'menu';   // menu | playing | paused | won | lost
let level = null;     // 当前关卡对象
let levelIndex = 0;
let honor = 175;
let defenders = [];   // {type,row,col,x,y,hp,maxHp,fireT,def}
let enemies = [];     // {type,row,x,hp,maxHp,speed,def,slowT,eaten(target),atkT,summonT,healT,phase}
let bullets = [];     // 我方子弹 {x,y,row,dmg,pierce,slow,hit:Set,vx}
let hostiles = [];    // 敌方投射物 {x,y,row,dmg,vx}
let medals = [];      // {x,y,vy,landY,life,medal:{t,v,w}}
let floats = [];      // 飘字 {x,y,text,color,t,vy,size}
let mowers = [];      // 清台机 {row,used,x,active}
let selectedCard = null;
let waveIdx = 0;
let elapsed = 0;      // 关卡内计时
let medalDropT = 0;
let surgeT = 0;       // 热搜风暴剩余时间(全体加速)
let lastTs = 0;
let cardCooldowns = {}; // { defenderKey: remainingSeconds }
const pauseReasons = new Set(); // manual | portrait | hidden | resume-required

// ====================== 工具函数 ======================
function cellCenterX(col) { return BOARD_X + col * CELL_W + CELL_W / 2; }
function cellCenterY(row) { return BOARD_Y + row * CELL_H + CELL_H / 2; }
function rowFromY(y) { return Math.floor((y - BOARD_Y) / CELL_H); }
function colFromX(x) { return Math.floor((x - BOARD_X) / CELL_W); }
function rand(a, b) { return a + Math.random() * (b - a); }
function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }

function addFloat(x, y, text, color, size) {
  // 飘字统一放大 1.35 倍,移动端缩放后更易读;停留时间也略延长
  floats.push({ x, y, text, color: color || '#fff', t: 1.7, vy: -34, size: Math.round((size || 16) * 1.35) });
}

// ====================== 关卡启停 ======================
function startLevel(idx) {
  levelIndex = idx;
  level = LEVELS[idx];
  honor = level.startHonor;
  defenders = []; enemies = []; bullets = []; hostiles = []; medals = []; floats = [];
  selectedCard = null; waveIdx = 0; elapsed = 0; medalDropT = 3; surgeT = 0;
  cardCooldowns = {}; killQuoteCd = 0; banner = null; pauseReasons.clear();
  mowers = [];
  for (let r = 0; r < ROWS; r++) mowers.push({ row: r, used: false, x: HOME_X - 26, active: false });
  hideAllOverlays();
  setGameState('playing');
  syncEnvironmentPause();
}

function availableDefenders() {
  return DEF_ORDER.filter(k => DEFENDERS[k].unlockLevel <= levelIndex);
}

// ====================== 输入 ======================
function canvasPoint(evt) {
  const rect = CV.getBoundingClientRect();
  const cx = (evt.touches ? evt.touches[0].clientX : evt.clientX) - rect.left;
  const cy = (evt.touches ? evt.touches[0].clientY : evt.clientY) - rect.top;
  return { x: cx / rect.width * W, y: cy / rect.height * H };
}

function handleTap(px, py) {
  if (state !== 'playing') return;
  // 1) 优先收集金牌(点击半径放宽,移动端更好点)
  for (let i = medals.length - 1; i >= 0; i--) {
    const m = medals[i];
    if (Math.hypot(px - m.x, py - m.y) < 46) {
      honor += m.medal.v;
      const big = m.medal.v >= 100;
      addFloat(m.x, m.y - 10, '🏆 夺冠！' + m.medal.t + ' +' + m.medal.v, big ? '#ffab00' : '#ffd54f', big ? 20 : 15);
      if (m.medal.v >= 150) addBanner('🏆 生涯高光时刻！' + m.medal.t + ' +' + m.medal.v);
      medals.splice(i, 1);
      return;
    }
  }
  // 2) 卡槽点击
  const cards = availableDefenders();
  const cardW = 96, gap = 6, startX = 150;
  if (py < 88 && py > 10) {
    for (let i = 0; i < cards.length; i++) {
      const cx = startX + i * (cardW + gap);
      if (px >= cx && px <= cx + cardW) {
        const key = cards[i];
        const cooldown = cardCooldowns[key] || 0;
        if (cooldown > 0) addFloat(cx + cardW / 2, 84, '冷却中 ' + Math.ceil(cooldown) + '秒', '#90caf9', 14);
        else if (honor >= DEFENDERS[key].cost) selectedCard = (selectedCard === key ? null : key);
        else addFloat(cx + cardW / 2, 84, '荣誉值不足', '#ff8a80', 14);
        return;
      }
    }
  }
  // 3) 棋盘放置
  if (selectedCard && px > BOARD_X && px < BOARD_X + BOARD_W && py > BOARD_Y && py < BOARD_Y + BOARD_H) {
    const col = colFromX(px), row = rowFromY(py);
    if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return;
    const def = DEFENDERS[selectedCard];
    if ((cardCooldowns[selectedCard] || 0) > 0) {
      addFloat(cellCenterX(col), cellCenterY(row), '装备仍在冷却', '#90caf9', 14);
      selectedCard = null;
      return;
    }
    if (honor < def.cost) {
      addFloat(cellCenterX(col), cellCenterY(row), '荣誉值不足', '#ff8a80', 14);
      selectedCard = null;
      return;
    }
    if (def.kind === 'bomb') {
      // 爆破热气球:立即清一行,必飘一句调侃
      honor -= def.cost;
      const bx = cellCenterX(col), by = cellCenterY(row);
      addFloat(bx, by, '💥 热气球爆破！', '#ff5252', 30);
      addFloat(bx, by + 30, '💬 ' + pick(KILL_QUOTES), '#ffd54f', 16);
      killQuoteCd = 3.5;
      for (const e of enemies) if (e.row === row) e.hp -= def.dmg;
      if (def.cd > 0) cardCooldowns[selectedCard] = def.cd;
      resolveEnemyDeaths();
      selectedCard = null;
      return;
    }
    if (defenders.some(d => d.row === row && d.col === col)) {
      addFloat(cellCenterX(col), cellCenterY(row), '此处已有装备', '#ffcc80', 14);
      return;
    }
    honor -= def.cost;
    defenders.push({
      type: selectedCard, def, row, col,
      x: cellCenterX(col), y: cellCenterY(row),
      hp: def.hp, maxHp: def.hp, fireT: def.interval || 0, slowMul: 1,
    });
    if (def.cd > 0) cardCooldowns[selectedCard] = def.cd;
    selectedCard = null;
  }
}

CV.addEventListener('mousedown', e => { const p = canvasPoint(e); handleTap(p.x, p.y); });
CV.addEventListener('touchstart', e => { e.preventDefault(); const p = canvasPoint(e); handleTap(p.x, p.y); }, { passive: false });

// ====================== 波次调度 ======================
function updateWaves(dt) {
  if (waveIdx >= level.waves.length) return;
  const wave = level.waves[waveIdx];
  if (elapsed >= wave.at) {
    for (const s of wave.spawns) {
      spawnEnemy(s.type, (s.row != null) ? s.row : (Math.random() * ROWS) | 0);
    }
    if (wave.surge) { surgeT = 8; addBanner('🔥 热搜风暴！僵尸加速'); }
    if (wave.boss) { addBanner('🧟 BOSS · 饭圈僵尸王登场'); }
    waveIdx++;
  }
}

function spawnEnemy(type, row) {
  const d = ENEMIES[type];
  enemies.push({
    type, def: d, row,
    x: W + rand(0, 60), hp: d.hp, maxHp: d.hp,
    speed: d.speed, slowT: 0, atkT: 0, summonT: 4, healT: 3, phase: 0,
  });
}

let banner = null;
function addBanner(text) { banner = { text, t: 2.4 }; }

function resolveEnemyDeaths() {
  enemies = enemies.filter(e => {
    if (e.hp > 0) return true;
    // Boss 只用专属宣言;小怪 6:4 混抽专属池与通用池。
    const pool = e.def.boss ? e.def.dead : (Math.random() < 0.6 ? e.def.dead : COMMON_DEAD);
    addFloat(e.x, cellCenterY(e.row) - 18, '「' + pick(pool) + '」', e.def.color, e.def.boss ? 22 : 14);
    // 防御方调侃语录带冷却,避免密集波次遮住战场。
    if (killQuoteCd <= 0) {
      killQuoteCd = 3.5;
      addFloat(cellCenterX(1), cellCenterY(e.row) + 6, '💬 ' + pick(KILL_QUOTES), '#ffd54f', 15);
    }
    return false;
  });
}

// ====================== 更新逻辑 ======================
function update(dt) {
  if (state !== 'playing') return;
  elapsed += dt;
  if (surgeT > 0) surgeT -= dt;
  if (killQuoteCd > 0) killQuoteCd = Math.max(0, killQuoteCd - dt);
  for (const key of Object.keys(cardCooldowns)) {
    cardCooldowns[key] = Math.max(0, cardCooldowns[key] - dt);
    if (cardCooldowns[key] === 0) delete cardCooldowns[key];
  }

  // 接住点击爆冲或上一帧末尾产生的死亡,保证死敌本帧不再行动。
  resolveEnemyDeaths();

  updateWaves(dt);

  // 勋章自然掉落
  medalDropT -= dt;
  if (medalDropT <= 0) {
    medalDropT = rand(6, 9);
    dropMedal(rand(BOARD_X + 40, BOARD_X + BOARD_W - 40), -20, rand(BOARD_Y + 40, BOARD_Y + BOARD_H - 40));
  }
  for (const m of medals) {
    if (m.y < m.landY) { m.y += m.vy * dt; if (m.y > m.landY) m.y = m.landY; }
    m.life -= dt;
  }
  medals = medals.filter(m => m.life > 0);

  // 防御单位
  const surgeMul = surgeT > 0 ? 1.6 : 1;
  for (const d of defenders) {
    d.slowMul = 1;
    // 控评盾卫压制光环：附近防御单位攻速下降
    for (const e of enemies) {
      if (e.hp > 0 && e.def.aura && e.row === d.row && Math.abs(e.x - d.x) < CELL_W * 1.6) d.slowMul = 1.8;
    }
    if (d.def.kind === 'producer') {
      d.fireT -= dt;
      if (d.fireT <= 0) { d.fireT = d.def.interval; dropMedal(d.x, d.y, d.y - 4); }
    } else if (d.def.kind === 'shooter') {
      const enemyAhead = enemies.some(e => e.hp > 0 && e.row === d.row && e.x > d.x - 6 && e.x < W);
      d.fireT -= dt;
      if (enemyAhead && d.fireT <= 0) {
        d.fireT = d.def.interval * d.slowMul;
        bullets.push({
          x: d.x + 18, y: d.y - 6, row: d.row, dmg: d.def.dmg,
          pierce: !!d.def.pierce, slow: !!d.def.slow, vx: 420, hit: new Set(),
          color: d.def.slow ? '#fdd835' : (d.def.pierce ? '#7986cb' : '#e0f7fa'),
        });
      }
    }
  }

  // 我方子弹
  for (const b of bullets) {
    b.x += b.vx * dt;
    for (const e of enemies) {
      if (e.hp <= 0) continue;
      if (e.row !== b.row) continue;
      if (b.hit.has(e)) continue;
      if (b.x >= e.x - 22 && b.x <= e.x + 22) {
        const dmg = b.dmg * (e.def.armor ? (1 - e.def.armor) : 1);
        e.hp -= dmg;
        if (b.slow) e.slowT = 3;
        b.hit.add(e);
        if (!b.pierce) { b.dead = true; break; }
      }
    }
  }
  bullets = bullets.filter(b => !b.dead && b.x < W + 20);
  resolveEnemyDeaths();

  // 敌方投射物（阴谋论僵尸的飞斧）
  for (const h of hostiles) {
    h.x += h.vx * dt;
    for (const d of defenders) {
      if (d.hp > 0 && d.row === h.row && Math.abs(d.x - h.x) < 20) { d.hp -= h.dmg; h.dead = true; break; }
    }
  }
  hostiles = hostiles.filter(h => !h.dead && h.x > BOARD_X - 20);
  defenders = defenders.filter(d => d.hp > 0);

  // 怪物。遍历快照,避免 Boss 新召唤的单位在出生同帧立刻行动。
  for (const e of enemies.slice()) {
    if (e.hp <= 0) continue;
    const slowMul = e.slowT > 0 ? 0.45 : 1;
    if (e.slowT > 0) e.slowT -= dt;
    const spd = e.speed * slowMul * surgeMul;

    // 是否被防御单位挡住(啃咬)
    let blocker = null;
    for (const d of defenders) {
      if (d.hp > 0 && d.row === e.row && e.x - 20 <= d.x + 20 && e.x > d.x - 4) { blocker = d; break; }
    }

    // 远程怪:在防线前一格停下投掷
    if (e.def.ranged && !blocker) {
      let target = null;
      for (const d of defenders) if (d.hp > 0 && d.row === e.row && d.x < e.x && e.x - d.x < CELL_W * 3) { target = d; break; }
      if (target) {
        e.atkT -= dt;
        if (e.atkT <= 0) { e.atkT = 1.6; hostiles.push({ x: e.x - 16, y: cellCenterY(e.row) - 8, row: e.row, dmg: e.def.dmg, vx: -260 }); }
      } else { e.x -= spd * dt; }
    } else if (blocker) {
      e.atkT -= dt;
      if (e.atkT <= 0) { e.atkT = 0.6; blocker.hp -= e.def.dmg; }
    } else {
      e.x -= spd * dt;
    }

    // Boss 技能
    if (e.def.boss) {
      e.summonT -= dt;
      if (e.summonT <= 0) { e.summonT = 9; for (let i = 0; i < 3; i++) spawnEnemy('troll', (Math.random() * ROWS) | 0); addBanner('📢 僵尸王召唤水军僵尸！'); surgeT = Math.max(surgeT, 5); }
      const ratio = e.hp / e.maxHp;
      if (ratio < 0.66 && e.phase < 1) { e.phase = 1; addFloat(e.x, cellCenterY(e.row) - 30, '“研究队友！”', '#ffcdd2', 18); }
      if (ratio < 0.33 && e.phase < 2) { e.phase = 2; addFloat(e.x, cellCenterY(e.row) - 30, '“菜谱都背下来了！”', '#ffcdd2', 18); }
    }
    // 数据注水僵尸治疗光环
    if (e.def.heal) {
      e.healT -= dt;
      if (e.healT <= 0) {
        e.healT = 4;
        for (const o of enemies) if (o !== e && o.hp > 0 && Math.abs(o.x - e.x) < CELL_W * 2 && o.hp < o.maxHp) { o.hp = Math.min(o.maxHp, o.hp + 30); }
        addFloat(e.x, cellCenterY(e.row) - 24, '📈 数据注水回血', '#80cbc4', 14);
      }
    }

    // 到家判定
    if (e.x < HOME_X + 6) {
      const mw = mowers[e.row];
      if (mw && !mw.used) {
        mw.used = true; mw.active = true; mw.x = HOME_X - 26;
        addFloat(HOME_X + 70, cellCenterY(e.row) - 26, '🚜 清台机出动！', '#fff59d', 16);
      }
    }
  }

  // 清台机冲刺(被触发后横扫本行)
  for (const mw of mowers) {
    if (mw.active) {
      const prevX = mw.x;
      mw.x += 400 * dt;
      for (const e of enemies) {
        if (e.hp > 0 && e.row === mw.row && e.x >= prevX - 40 && e.x <= mw.x + 16) e.hp = 0;
      }
      if (mw.x > W + 40) mw.active = false;
    }
  }

  resolveEnemyDeaths();

  // 清台机仍在冲刺时本行受保护;只有已经耗尽后再次越线才判负。
  for (const e of enemies) {
    if (e.hp <= 0 || e.x >= HOME_X + 6) continue;
    const mw = mowers[e.row];
    if (!mw || (mw.used && !mw.active)) { triggerLose(); return; }
  }

  defenders = defenders.filter(d => d.hp > 0);

  // 飘字
  for (const f of floats) { f.y += f.vy * dt; f.t -= dt; }
  floats = floats.filter(f => f.t > 0);
  if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }

  // 胜利判定:所有波次已生成 且 场上无敌人 且 清台机已跑完(别在冲刺一半时弹结算)
  if (waveIdx >= level.waves.length && enemies.length === 0 && !mowers.some(m => m.active)
      && elapsed > (level.waves[level.waves.length - 1].at + 2)) {
    triggerWin();
  }
}

function dropMedal(x, startY, landY) {
  medals.push({ x, y: startY, landY, vy: 130, life: 10, medal: pickMedal() });
}

// ====================== 结算 ======================
function starsForLevel() {
  const used = mowers.filter(m => m.used).length;
  if (used === 0) return 3;
  if (used <= 2) return 2;
  return 1;
}
function triggerWin() {
  pauseReasons.clear();
  setGameState('won');
  const stars = starsForLevel();
  SAVE.stars[levelIndex] = Math.max(SAVE.stars[levelIndex] || 0, stars);
  if (SAVE.cleared.indexOf(levelIndex) < 0) SAVE.cleared.push(levelIndex);
  saveGame(SAVE);
  showResult(true, stars);
}
function triggerLose() {
  pauseReasons.clear();
  setGameState('lost');
  showResult(false, 0);
}

// ====================== 渲染 ======================
function draw() {
  ctx.clearRect(0, 0, W, H);
  // 背景(泥土/天空基底)
  ctx.fillStyle = '#3e2723';
  ctx.fillRect(0, 0, W, H);
  // 顶栏
  drawTopBar();
  // 经典 PvZ 双色草坪
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const x = BOARD_X + c * CELL_W, y = BOARD_Y + r * CELL_H;
      ctx.fillStyle = ((r + c) % 2 === 0) ? '#94c848' : '#7bb33a';
      ctx.fillRect(x, y, CELL_W, CELL_H);
    }
  }
  // 左侧球员席(泥土边)
  ctx.fillStyle = '#6d4c41';
  ctx.fillRect(0, BOARD_Y, BOARD_X, BOARD_H);
  // 草坪外框
  ctx.strokeStyle = 'rgba(51,105,30,.8)'; ctx.lineWidth = 3;
  ctx.strokeRect(BOARD_X, BOARD_Y, BOARD_W, BOARD_H);
  // 放置高亮
  if (selectedCard) drawPlacementHint();

  // 割草机(清台机)
  for (const mw of mowers) {
    const y = cellCenterY(mw.row);
    if (!mw.used) {
      // 待命:停靠带上画个停车位衬底,让它读得出来是"一台机器"
      ctx.fillStyle = 'rgba(0,0,0,.25)';
      ctx.beginPath(); ctx.ellipse(mw.x, y + 14, 19, 6, 0, 0, Math.PI * 2); ctx.fill();
    } else if (mw.active) {
      // 冲刺中:车后扬尘
      ctx.fillStyle = 'rgba(255,255,255,.55)';
      for (let i = 1; i <= 3; i++) {
        ctx.beginPath(); ctx.arc(mw.x - 20 - i * 13, y + rand(-9, 9), 6 - i, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.font = '34px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🚜', mw.x, y);
  }

  // 防御单位
  for (const d of defenders) drawDefender(d);
  // 敌方投射物：旋转飞行的斧子
  for (const h of hostiles) {
    ctx.save();
    ctx.translate(h.x, h.y);
    ctx.rotate(h.x / 18);
    ctx.font = '24px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🪓', 0, 0);
    ctx.restore();
  }
  // 子弹
  for (const b of bullets) {
    ctx.beginPath(); ctx.fillStyle = b.color;
    ctx.arc(b.x, b.y, b.pierce ? 9 : 7, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 1; ctx.stroke();
  }
  // 怪物
  for (const e of enemies) drawEnemy(e);
  // 勋章
  for (const m of medals) drawMedal(m);
  // 飘字(按文字实际宽度夹在画布内,不飘出屏幕)
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const f of floats) {
    ctx.globalAlpha = Math.min(1, f.t);
    ctx.font = 'bold ' + f.size + 'px sans-serif';
    const tw = ctx.measureText(f.text).width;
    const fx = Math.max(tw / 2 + 8, Math.min(W - tw / 2 - 8, f.x));
    const fy = Math.max(f.size + 6, Math.min(H - 10, f.y));
    ctx.fillStyle = f.color;
    ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.lineWidth = 3;
    ctx.strokeText(f.text, fx, fy); ctx.fillText(f.text, fx, fy);
  }
  ctx.globalAlpha = 1;
  // 横幅
  if (banner) {
    ctx.globalAlpha = Math.min(1, banner.t);
    ctx.fillStyle = 'rgba(198,40,40,.85)';
    ctx.fillRect(0, H / 2 - 34, W, 68);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 30px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(banner.text, W / 2, H / 2);
    ctx.globalAlpha = 1;
  }
  // 选中卡槽后显示单位说明，兼容桌面点击和移动端触摸。
  drawSelectedCardTip();
}

function drawTopBar() {
  ctx.fillStyle = '#4e342e'; ctx.fillRect(0, 0, W, 92);
  // 阳光值(荣誉)
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 26px sans-serif'; ctx.fillStyle = '#ffd54f';
  ctx.fillText('☀️ ' + Math.floor(honor), 18, 32);
  ctx.font = '14px sans-serif'; ctx.fillStyle = '#ffe0b2';
  ctx.fillText('荣誉值', 20, 60);
  // 关卡名 + 进度
  ctx.textAlign = 'right'; ctx.font = 'bold 17px sans-serif'; ctx.fillStyle = '#fff3e0';
  ctx.fillText(level ? level.name : '', W - 16, 22);
  ctx.font = '14px sans-serif'; ctx.fillStyle = '#ffcc80';
  ctx.fillText('波次 ' + Math.min(waveIdx, level ? level.waves.length : 0) + ' / ' + (level ? level.waves.length : 0), W - 16, 46);
  ctx.fillStyle = '#c5e1a5';
  ctx.fillText('三星目标：不启用清台机', W - 16, 68);
  // 卡槽(种子卡)
  const cards = availableDefenders();
  const cardW = 96, gap = 6, startX = 150, cardY = 12, cardH = 68;
  for (let i = 0; i < cards.length; i++) {
    const key = cards[i], def = DEFENDERS[key];
    const cx = startX + i * (cardW + gap);
    const cooldown = cardCooldowns[key] || 0;
    const afford = honor >= def.cost;
    const usable = afford && cooldown <= 0;
    ctx.fillStyle = selectedCard === key ? '#ffca28' : (usable ? '#8d6e63' : '#5d4037');
    roundRect(cx, cardY, cardW, cardH, 8); ctx.fill();
    ctx.strokeStyle = selectedCard === key ? '#fff' : 'rgba(255,255,255,.25)'; ctx.lineWidth = selectedCard === key ? 3 : 1; ctx.stroke();
    ctx.globalAlpha = usable ? 1 : 0.55;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (def.table) {
      drawTable(cx + 22, cardY + 28, 28, 24, null);
    } else {
      ctx.font = '24px serif'; ctx.fillStyle = '#fff'; ctx.fillText(def.emoji, cx + 22, cardY + 26);
    }
    ctx.font = 'bold 13px sans-serif'; ctx.fillStyle = '#fff'; ctx.textAlign = 'left';
    ctx.fillText(def.name, cx + 40, cardY + 20);
    ctx.font = 'bold 15px sans-serif'; ctx.fillStyle = '#ffe082';
    ctx.fillText('☀️' + def.cost, cx + 40, cardY + 44);
    ctx.globalAlpha = 1;
    if (cooldown > 0) {
      ctx.fillStyle = 'rgba(20,34,45,.72)';
      roundRect(cx, cardY, cardW, cardH, 8); ctx.fill();
      ctx.fillStyle = '#e3f2fd'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = 'bold 18px sans-serif'; ctx.fillText('⏱' + Math.ceil(cooldown), cx + cardW / 2, cardY + cardH / 2);
    }
  }
}

function drawSelectedCardTip() {
  const def = DEFENDERS[selectedCard];
  if (!def || state !== 'playing') return;
  const text = def.name + '：' + def.desc;
  ctx.save();
  ctx.font = 'bold 17px sans-serif';
  const tipW = Math.min(W - 32, ctx.measureText(text).width + 44);
  const tipH = 42;
  const tipX = (W - tipW) / 2;
  const tipY = BOARD_Y + 8;
  ctx.fillStyle = 'rgba(38, 50, 56, .92)';
  roundRect(tipX, tipY, tipW, tipH, 12); ctx.fill();
  ctx.strokeStyle = '#ffd54f'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#fffde7';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, W / 2, tipY + tipH / 2);
  ctx.restore();
}

function drawPlacementHint() {
  const def = DEFENDERS[selectedCard];
  if (!def) return;
  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      const occupied = defenders.some(d => d.row === row && d.col === col);
      const available = def.kind === 'bomb' || !occupied;
      const x = BOARD_X + col * CELL_W, y = BOARD_Y + row * CELL_H;
      ctx.fillStyle = available ? 'rgba(255,235,59,.13)' : 'rgba(239,83,80,.16)';
      ctx.fillRect(x + 4, y + 4, CELL_W - 8, CELL_H - 8);
      ctx.strokeStyle = available ? 'rgba(255,245,157,.7)' : 'rgba(239,154,154,.55)';
      ctx.lineWidth = 2;
      ctx.strokeRect(x + 5, y + 5, CELL_W - 10, CELL_H - 10);
    }
  }
}

// 立起来的乒乓球桌(肉盾造型):蓝色桌面+白色边线/中线+桌腿
function drawTable(x, y, w, h, hpRatio) {
  ctx.save();
  ctx.translate(x, y);
  // 桌腿
  ctx.fillStyle = '#37474f';
  ctx.fillRect(-w * 0.32, h * 0.32, w * 0.12, h * 0.2);
  ctx.fillRect(w * 0.2, h * 0.32, w * 0.12, h * 0.2);
  // 桌面(受损越重颜色越暗)
  const shade = hpRatio == null ? 1 : (0.55 + 0.45 * hpRatio);
  ctx.fillStyle = 'rgb(' + Math.round(21 * shade + 20) + ',' + Math.round(101 * shade + 20) + ',' + Math.round(192 * shade + 20) + ')';
  roundRect(-w / 2, -h / 2, w, h * 0.84, 4); ctx.fill();
  // 白色边线 + 中线
  ctx.strokeStyle = '#fff'; ctx.lineWidth = Math.max(1.5, w * 0.03);
  roundRect(-w / 2 + 2, -h / 2 + 2, w - 4, h * 0.84 - 4, 3); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -h / 2 + 2); ctx.lineTo(0, -h / 2 + h * 0.84 - 2); ctx.stroke();
  // 裂纹(残血时)
  if (hpRatio != null && hpRatio < 0.45) {
    ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-w * 0.3, -h * 0.3); ctx.lineTo(-w * 0.05, 0); ctx.lineTo(-w * 0.25, h * 0.25); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(w * 0.25, -h * 0.2); ctx.lineTo(w * 0.1, h * 0.1); ctx.stroke();
  }
  ctx.restore();
}

function drawDefender(d) {
  const x = d.x, y = d.y;
  if (d.def.table) {
    // 乒乓球桌肉盾:不画底座,直接画立起来的球桌
    drawTable(x, y, CELL_W * 0.74, CELL_H * 0.7, d.hp / d.maxHp);
  } else {
    // 身体底座
    ctx.fillStyle = d.def.color; ctx.globalAlpha = 0.9;
    roundRect(x - CELL_W / 2 + 8, y - CELL_H / 2 + 8, CELL_W - 16, CELL_H - 16, 10); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.font = Math.floor(CELL_H * 0.42) + 'px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(d.def.emoji, x, y - 2);
  }
  // 血条
  if (d.hp < d.maxHp) {
    const w = CELL_W - 24, hp = Math.max(0, d.hp / d.maxHp);
    ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillRect(x - w / 2, y + CELL_H / 2 - 14, w, 5);
    ctx.fillStyle = hp > 0.4 ? '#66bb6a' : '#ef5350'; ctx.fillRect(x - w / 2, y + CELL_H / 2 - 14, w * hp, 5);
  }
}

function zombieLimb(x1, y1, x2, y2, width, color) {
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
}

function zombieFace(x, y, rx, ry, skin, mood) {
  // 不对称脑袋和外凸眼睛，让轮廓更像夸张卡通而不是统一 emoji。
  ctx.fillStyle = skin;
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, -0.12, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#263238';
  ctx.lineWidth = 2.4;
  ctx.stroke();

  const eyeY = y - ry * 0.2;
  ctx.fillStyle = '#f5f1cf';
  ctx.beginPath(); ctx.arc(x - rx * 0.34, eyeY, rx * 0.22, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(x + rx * 0.25, eyeY - 2, rx * 0.27, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#263238';
  ctx.beginPath(); ctx.arc(x - rx * 0.3, eyeY + 1, Math.max(1.7, rx * 0.07), 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + rx * 0.19, eyeY, Math.max(1.7, rx * 0.08), 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = '#5d4037';
  ctx.beginPath();
  if (mood === 'yell') ctx.ellipse(x, y + ry * 0.42, rx * 0.37, ry * 0.25, 0.1, 0, Math.PI * 2);
  else {
    ctx.moveTo(x - rx * 0.4, y + ry * 0.32);
    ctx.quadraticCurveTo(x, y + ry * 0.57, x + rx * 0.42, y + ry * 0.25);
    ctx.lineTo(x + rx * 0.3, y + ry * 0.58);
    ctx.lineTo(x - rx * 0.32, y + ry * 0.56);
    ctx.closePath();
  }
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fffde7';
  ctx.fillRect(x - rx * 0.2, y + ry * 0.28, rx * 0.16, ry * 0.24);
  ctx.fillRect(x + rx * 0.06, y + ry * 0.27, rx * 0.17, ry * 0.2);
}

function drawZombieCharacter(e, s) {
  const k = s / 60;
  const skin = e.type === 'boss' ? '#78954c' : (e.type === 'troll' ? '#9aae68' : '#91a66a');
  ctx.save();
  ctx.scale(k, k);

  if (e.type === 'follower') {
    // 瘦高、探头探脑：最普通但轮廓不再是方正统一体型。
    zombieLimb(-7, 14, -13, 35, 7, skin); zombieLimb(8, 14, 13, 35, 7, skin);
    zombieLimb(-10, -5, -25, 8, 6, skin); zombieLimb(10, -4, 25, 3, 6, skin);
    ctx.fillStyle = '#7c8791'; ctx.beginPath(); ctx.moveTo(-12,-7); ctx.lineTo(13,-7); ctx.lineTo(10,23); ctx.lineTo(-9,20); ctx.closePath(); ctx.fill(); ctx.stroke();
    zombieFace(1, -21, 15, 17, skin, 'slack');
    ctx.fillStyle = '#263238'; ctx.fillRect(18, -2, 9, 15); ctx.strokeRect(18, -2, 9, 15);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.fillText('?', 22.5, -10);
  } else if (e.type === 'troll') {
    // 矮小前倾、双手机：速度感最强。
    ctx.rotate(-0.16);
    zombieLimb(-9, 14, -18, 28, 7, skin); zombieLimb(8, 14, 17, 28, 7, skin);
    ctx.fillStyle = '#673ab7'; ctx.beginPath(); ctx.ellipse(0, 6, 16, 18, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    zombieFace(5, -14, 14, 13, skin, 'yell');
    zombieLimb(-10, 0, -27, 2, 6, skin); zombieLimb(13, 0, 28, -4, 6, skin);
    ctx.fillStyle = '#202124'; ctx.fillRect(-31, -5, 9, 14); ctx.fillRect(24, -11, 9, 14);
    ctx.fillStyle = '#e1bee7';
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.ellipse(-12 + i * 12, -33 - (i % 2) * 5, 7, 5, 0, 0, Math.PI * 2); ctx.fill(); }
  } else if (e.type === 'blamer') {
    // 宽肩重装，背着一口远大于身体的黑锅。
    ctx.fillStyle = '#252525'; ctx.beginPath(); ctx.arc(-13, -1, 25, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    zombieLimb(-10, 16, -14, 34, 10, skin); zombieLimb(10, 16, 15, 34, 10, skin);
    ctx.fillStyle = '#d85b36'; ctx.beginPath(); ctx.ellipse(1, 7, 21, 24, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    zombieFace(5, -21, 17, 16, skin, 'slack');
    zombieLimb(16, -2, 34, -13, 8, skin);
    ctx.fillStyle = skin; ctx.beginPath(); ctx.moveTo(34,-13); ctx.lineTo(43,-17); ctx.lineTo(35,-7); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#f9a825'; ctx.font = '22px serif'; ctx.fillText('🍳', -25, -11);
  } else if (e.type === 'conspiracy') {
    // 极瘦侦探，长风衣和放大镜形成清楚的远程怪剪影。
    zombieLimb(-5, 14, -11, 36, 6, skin); zombieLimb(7, 14, 12, 36, 6, skin);
    ctx.fillStyle = '#37474f'; ctx.beginPath(); ctx.moveTo(-13,-8); ctx.lineTo(13,-8); ctx.lineTo(18,27); ctx.lineTo(0,20); ctx.lineTo(-18,27); ctx.closePath(); ctx.fill(); ctx.stroke();
    zombieFace(0, -24, 13, 17, skin, 'slack');
    ctx.fillStyle = '#263238'; ctx.fillRect(-16, -42, 33, 5); ctx.fillRect(-10, -51, 22, 11);
    zombieLimb(10, -3, 30, 8, 6, skin);
    ctx.strokeStyle = '#cfd8dc'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(34, 10, 8, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(29,16); ctx.lineTo(23,27); ctx.stroke();
    ctx.fillStyle = '#e1bee7'; ctx.font = 'bold 18px sans-serif'; ctx.fillText('?', -24, -20);
  } else if (e.type === 'shield') {
    // 最大号普通怪：重甲体型，举着巨大盾牌压制防线。
    zombieLimb(-13, 17, -18, 38, 11, skin); zombieLimb(13, 17, 18, 38, 11, skin);
    ctx.fillStyle = '#455a64'; ctx.beginPath(); ctx.ellipse(0, 8, 28, 29, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    zombieFace(2, -25, 19, 18, skin, 'yell');
    ctx.fillStyle = '#263238'; ctx.beginPath(); ctx.arc(1, -38, 19, Math.PI, Math.PI * 2); ctx.fill(); ctx.fillRect(-18,-39,38,5);
    ctx.fillStyle = '#607d8b';
    ctx.beginPath(); ctx.moveTo(10,-12); ctx.lineTo(40,-7); ctx.lineTo(37,18); ctx.lineTo(25,34); ctx.lineTo(12,18); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#eceff1'; ctx.font = 'bold 18px sans-serif'; ctx.fillText('控', 25, 9);
    zombieLimb(-18, -3, -33, 9, 9, skin);
    ctx.fillStyle = '#ffd54f'; ctx.beginPath(); ctx.arc(-35, 11, 5, 0, Math.PI * 2); ctx.fill();
  } else if (e.type === 'data') {
    // 数据注水辅助怪：多部手机和上升曲线形成清楚的治疗型剪影。
    zombieLimb(-7, 17, -12, 38, 7, skin); zombieLimb(8, 17, 13, 38, 7, skin);
    ctx.fillStyle = '#00796b'; ctx.beginPath(); ctx.moveTo(-16,-8); ctx.lineTo(16,-8); ctx.lineTo(22,26); ctx.lineTo(-20,26); ctx.closePath(); ctx.fill(); ctx.stroke();
    zombieFace(0, -25, 16, 18, skin, 'slack');
    zombieLimb(-13, -2, -30, -13, 6, skin); zombieLimb(15, -2, 31, -14, 6, skin);
    ctx.fillStyle = '#263238'; ctx.fillRect(-39, -25, 15, 25); ctx.strokeRect(-39, -25, 15, 25);
    ctx.fillRect(27, -27, 15, 25); ctx.strokeRect(27, -27, 15, 25);
    ctx.fillStyle = '#80cbc4'; ctx.fillRect(-36, -22, 9, 16); ctx.fillRect(30, -24, 9, 16);
    ctx.strokeStyle = '#ffd54f'; ctx.lineWidth = 3; ctx.beginPath();
    ctx.moveTo(-9, 12); ctx.lineTo(-1, 3); ctx.lineTo(7, 8); ctx.lineTo(17, -5); ctx.stroke();
    ctx.fillStyle = '#ffd54f'; ctx.beginPath(); ctx.moveTo(17,-5); ctx.lineTo(10,-3); ctx.lineTo(15,3); ctx.closePath(); ctx.fill();
  } else {
    // BOSS：巨型宽体、披风、扩音器、手机屏幕光环。
    ctx.fillStyle = 'rgba(255,23,68,.24)'; ctx.beginPath(); ctx.arc(0, -5, 43, 0, Math.PI * 2); ctx.fill();
    zombieLimb(-18, 18, -24, 42, 13, skin); zombieLimb(18, 18, 25, 42, 13, skin);
    ctx.fillStyle = '#7f1721'; ctx.beginPath(); ctx.moveTo(-36,-10); ctx.lineTo(35,-10); ctx.lineTo(29,39); ctx.lineTo(-30,39); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#d32f2f'; ctx.beginPath(); ctx.moveTo(-25,-9); ctx.lineTo(-46,32); ctx.lineTo(-23,26); ctx.closePath(); ctx.fill(); ctx.stroke();
    zombieFace(-3, -34, 24, 23, skin, 'yell');
    zombieLimb(21, -7, 42, 0, 12, skin);
    ctx.fillStyle = '#ffc107'; ctx.beginPath(); ctx.moveTo(36,-13); ctx.lineTo(67,-24); ctx.lineTo(67,15); ctx.lineTo(36,6); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#5d4037'; ctx.fillRect(31, 0, 11, 23); ctx.strokeRect(31, 0, 11, 23);
    ctx.strokeStyle = '#ff8a80'; ctx.lineWidth = 3;
    for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.arc(67, -4, 11 + i * 7, -0.7, 0.7); ctx.stroke(); }
    for (let i = 0; i < 5; i++) {
      const a = i * Math.PI * 0.42 + 0.2;
      const px = Math.cos(a) * 45, py = Math.sin(a) * 21 - 36;
      ctx.fillStyle = '#263238'; ctx.fillRect(px - 5, py - 7, 10, 14);
      ctx.fillStyle = '#64b5f6'; ctx.fillRect(px - 3, py - 5, 6, 8);
    }
  }
  ctx.restore();
}

function drawEnemy(e) {
  const x = e.x, y = cellCenterY(e.row);
  const s = e.def.boss ? Math.floor(CELL_H * 0.85) : Math.floor(CELL_H * 0.55);
  if (e.def.boss) {
    ctx.fillStyle = 'rgba(198,40,40,.35)';
    ctx.beginPath(); ctx.arc(x, y, CELL_H * 0.62, 0, Math.PI * 2); ctx.fill();
  }
  if (e.slowT > 0) { ctx.fillStyle = 'rgba(100,181,246,.4)'; ctx.beginPath(); ctx.arc(x, y, s * 0.6, 0, Math.PI * 2); ctx.fill(); }
  // 僵尸蹒跚摇摆
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(Math.sin(e.x / 14) * 0.09);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  drawZombieCharacter(e, s);
  ctx.restore();
  // 名牌
  ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(0,0,0,.6)';
  const nw = ctx.measureText(e.def.name).width + 10;
  ctx.fillRect(x - nw / 2, y + s / 2 + 2, nw, 17);
  ctx.fillStyle = '#fff';
  ctx.fillText(e.def.name, x, y + s / 2 + 11);
  // 血条
  const w = e.def.boss ? CELL_W * 1.4 : CELL_W - 26;
  const hp = Math.max(0, e.hp / e.maxHp);
  ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(x - w / 2, y - s / 2 - 14, w, 6);
  ctx.fillStyle = e.def.boss ? '#ff1744' : (hp > 0.4 ? '#ffca28' : '#ef5350');
  ctx.fillRect(x - w / 2, y - s / 2 - 14, w * hp, 6);
}

function drawMedal(m) {
  // 经典 PvZ 阳光造型:金色光球+光芒,中心是金牌;含金量越高,阳光越大越金
  const tier = m.medal.v >= 150 ? 2 : (m.medal.v >= 60 ? 1 : 0);
  const R = [22, 28, 36][tier];
  ctx.save();
  ctx.translate(m.x, m.y);
  const pulse = 1 + Math.sin(m.life * 5) * 0.06;
  ctx.scale(pulse, pulse);
  const g = ctx.createRadialGradient(0, 0, 4, 0, 0, R);
  g.addColorStop(0, tier === 2 ? 'rgba(255,213,0,.98)' : 'rgba(255,241,118,.95)');
  g.addColorStop(0.7, tier === 2 ? 'rgba(255,171,0,.85)' : 'rgba(255,213,79,.75)');
  g.addColorStop(1, 'rgba(255,213,79,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fill();
  // 光芒
  ctx.strokeStyle = tier === 2 ? 'rgba(255,196,0,.95)' : 'rgba(255,224,130,.8)'; ctx.lineWidth = tier === 2 ? 3 : 2;
  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4 + m.life;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * (R - 6), Math.sin(a) * (R - 6));
    ctx.lineTo(Math.cos(a) * (R + 2), Math.sin(a) * (R + 2));
    ctx.stroke();
  }
  ctx.font = [20, 24, 30][tier] + 'px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('🥇', 0, 0);
  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

// ====================== 主循环 ======================
let rafId = null;

function scheduleFrame() {
  if (rafId == null && !document.hidden) rafId = requestAnimationFrame(loop);
}

function setGameState(nextState) {
  state = nextState;
  lastTs = 0;
  updateGameControls();
  if (nextState !== 'playing' && rafId != null) {
    cancelAnimationFrame(rafId);
    rafId = null;
  }
  scheduleFrame();
}

function loop(ts) {
  rafId = null;
  const dt = lastTs ? Math.min(0.05, (ts - lastTs) / 1000) : 0;
  lastTs = ts;
  if (state === 'playing') update(dt);
  draw();
  if (state === 'paused') drawPauseVeil();
  if (state === 'playing') scheduleFrame();
}

function drawPauseVeil() {
  ctx.fillStyle = 'rgba(6,28,58,.62)';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 44px sans-serif';
  ctx.fillText('⏸ 已暂停', W / 2, H / 2 - 12);
  ctx.font = '20px sans-serif'; ctx.fillStyle = '#bbdefb';
  ctx.fillText('点击左下角「继续」回到战场', W / 2, H / 2 + 34);
}

const portraitMedia = window.matchMedia ? window.matchMedia('(max-aspect-ratio: 1/1)') : null;

function updateGameControls() {
  const btn = document.getElementById('pause-btn');
  const active = state === 'playing' || state === 'paused';
  btn.style.display = active ? 'block' : 'none';
  btn.textContent = state === 'paused' ? '▶ 继续' : '⏸ 暂停';
}

function applyPauseState() {
  if (state !== 'playing' && state !== 'paused') return;
  if (pauseReasons.size > 0 && state === 'playing') setGameState('paused');
  else if (pauseReasons.size === 0 && state === 'paused') setGameState('playing');
  else { updateGameControls(); scheduleFrame(); }
}

function syncEnvironmentPause() {
  if (state !== 'playing' && state !== 'paused') return;
  const wasPlaying = state === 'playing';
  const portrait = !!(portraitMedia && portraitMedia.matches);
  const hidden = !!document.hidden;

  if (portrait) pauseReasons.add('portrait'); else pauseReasons.delete('portrait');
  if (hidden) pauseReasons.add('hidden'); else pauseReasons.delete('hidden');
  if (wasPlaying && (portrait || hidden)) pauseReasons.add('resume-required');
  applyPauseState();
}

function togglePause() {
  if (state === 'playing') {
    pauseReasons.add('manual');
    applyPauseState();
    return;
  }
  if (state !== 'paused') return;
  syncEnvironmentPause();
  if (pauseReasons.has('portrait') || pauseReasons.has('hidden')) return;
  pauseReasons.delete('manual');
  pauseReasons.delete('resume-required');
  applyPauseState();
}

// ====================== 缩放适配 ======================
let canvasDpr = 0;
function resize() {
  const wrap = document.getElementById('wrap');
  const vw = wrap.clientWidth, vh = wrap.clientHeight;
  const scale = Math.min(vw / W, vh / H);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (dpr !== canvasDpr) {
    canvasDpr = dpr;
    CV.width = Math.round(W * dpr);
    CV.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  CV.style.width = (W * scale) + 'px';
  CV.style.height = (H * scale) + 'px';
  syncEnvironmentPause();
  scheduleFrame();
}
window.addEventListener('resize', resize);
document.addEventListener('visibilitychange', syncEnvironmentPause);
window.addEventListener('pagehide', () => {
  if (state !== 'playing' && state !== 'paused') return;
  if (state === 'playing') pauseReasons.add('resume-required');
  pauseReasons.add('hidden');
  applyPauseState();
});
window.addEventListener('pageshow', () => {
  pauseReasons.delete('hidden');
  syncEnvironmentPause();
});
if (portraitMedia) {
  if (portraitMedia.addEventListener) portraitMedia.addEventListener('change', syncEnvironmentPause);
  else if (portraitMedia.addListener) portraitMedia.addListener(syncEnvironmentPause);
}

// ====================== UI / 覆盖层 ======================
const ov = {
  menu: document.getElementById('ov-menu'),
  map: document.getElementById('ov-map'),
  dialog: document.getElementById('ov-dialog'),
  result: document.getElementById('ov-result'),
};
function hideAllOverlays() { Object.values(ov).forEach(o => o.classList.remove('show')); }
function showOverlay(name) { hideAllOverlays(); ov[name].classList.add('show'); scheduleFrame(); }

function buildMap() {
  const list = document.getElementById('level-list');
  list.innerHTML = '';
  LEVELS.forEach((lv, i) => {
    const unlocked = i === 0 || SAVE.cleared.indexOf(i - 1) >= 0;
    const stars = SAVE.stars[i] || 0;
    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'lv-card' + (unlocked ? '' : ' locked');
    card.disabled = !unlocked;
    card.innerHTML = '<span style="display:block;font-size:30px">' + ['📣','🔥','👑'][i] + '</span>' +
      '<span class="lv-title">' + lv.name.split(' · ')[0] + '</span>' +
      '<span class="lv-sub">' + lv.name.split(' · ')[1] + '</span>' +
      '<span class="stars">' + (unlocked ? ('★★★'.slice(0, stars) + '☆☆☆'.slice(0, 3 - stars)) : '🔒') + '</span>';
    if (unlocked) onTap(card, () => openDialog(i));
    list.appendChild(card);
  });
}

let pendingLevel = 0;
function openDialog(i) {
  pendingLevel = i;
  document.getElementById('dlg-title').textContent = LEVELS[i].dialogTitle;
  document.getElementById('dlg-body').innerHTML = LEVELS[i].dialog +
    '<br><span style="color:#c5e1a5">三星目标：不启用任何清台机</span>';
  showOverlay('dialog');
}

function showResult(win, stars) {
  const t = document.getElementById('res-title');
  const b = document.getElementById('res-body');
  const st = document.getElementById('res-stars');
  const un = document.getElementById('res-unlock');
  const nextBtn = document.getElementById('btn-res-next');
  if (win) {
    t.textContent = '防守成功！';
    t.style.color = '#a5d6a7';
    if (levelIndex === LEVELS.length - 1) {
      t.textContent = '轻舟已过万重山';
      b.innerHTML = '僵尸散尽，草坪如初。<br>体育就是体育，热爱就是热爱。<br><br>' +
        '<b style="font-size:1.15em">两岸猿声啼不住，轻舟已过万重山。</b><br>' +
        '那些聒噪，终究拦不住前行的人。<br><br>' +
        '最后：<b style="color:#ffd54f">“祝大家各自拥有美好人生。”</b>';
    } else {
      b.innerHTML = '这一轮噪音，被你挡了回去。';
    }
    st.textContent = '★★★'.slice(0, stars) + '☆☆☆'.slice(0, 3 - stars);
    un.textContent = LEVELS[levelIndex].unlockText || '';
    nextBtn.textContent = levelIndex < LEVELS.length - 1 ? '下一关' : '回到选关';
  } else {
    t.textContent = '草坪失守…';
    t.style.color = '#ef9a9a';
    b.innerHTML = '僵尸啃穿了防线。<br>别灰心——真正的强大，是一次次重新站上球台。';
    st.textContent = '';
    un.textContent = '';
    nextBtn.textContent = '重新挑战';
  }
  showOverlay('result');
}

// 按钮事件
// 防移动端 ghost click:touchend 后浏览器可能再合成一次 click。
// 只抑制 touchend 后的合成 click,不阻塞用户快速触摸下一块真实按钮。
let suppressClickUntil = 0;
function onTap(el, fn) {
  el.addEventListener('touchend', (e) => {
    suppressClickUntil = performance.now() + 500;
    e.preventDefault();
    fn();
  }, { passive: false });
  el.addEventListener('click', (e) => {
    if (performance.now() < suppressClickUntil) { e.preventDefault(); return; }
    fn();
  });
}

onTap(document.getElementById('btn-start'), () => { setGameState('menu'); buildMap(); showOverlay('map'); });
onTap(document.getElementById('pause-btn'), togglePause);
onTap(document.getElementById('btn-map-back'), () => { setGameState('menu'); showOverlay('menu'); });
onTap(document.getElementById('btn-dlg-next'), () => startLevel(pendingLevel));
onTap(document.getElementById('btn-res-retry'), () => startLevel(levelIndex));
onTap(document.getElementById('btn-res-next'), () => {
  if (state === 'lost') { startLevel(levelIndex); }
  else if (state === 'won' && levelIndex < LEVELS.length - 1) { openDialog(levelIndex + 1); }
  else { setGameState('menu'); buildMap(); showOverlay('map'); }
});

// ====================== 启动 ======================
resize();
showOverlay('menu');
})();
</script>
</body>
